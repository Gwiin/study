<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container-static, .container-relative{
            background-color: rgb(179, 255, 172);
        }
        .test-static{
            background-color: rgb(77, 192, 0);
            margin: 5px; padding: 5px;
            position: static;
        }
        .test-relative{
            background-color: rgb(77, 192, 0);
            margin: 5px; padding: 5px;
            position: relative;
        }

        #test-relative-3{
            left: 5px; top: 3px; 
        }

        .container-fixed{
            background-color: beige;
        }
        .test-fixed{
            background-color: blue;
            position: fixed;
            width: 200px; height: 50px;
            left: 0px; top: 0px;
        }

        .container-absolute{
            position: relative;
            width: 480px; height: 425px;
            background-image: url(img/logo.jpg);
        }
        .test-absolute{
            background-color: antiquewhite;
            position: absolute;
            left: 0px; top: 0px;

        }


    </style>
</head>
<body>
    <div class="container-static">
        <div class="test-static">static content 1</div>
        <div class="test-static">static content 2</div>
        <div class="test-static">static content 3</div>
        <div class="test-static">static content 4</div>
    </div>
    
    <div class="container-relative">
        <div class="test-relative">relative content 1</div>
        <div class="test-relative">relative content 2</div>
        <div class="test-relative" id="test-relative-3">relative content 3</div>
        <div class="test-relative">relative content 4</div>
    </div>

    <div class="container-fixed">
        <div class="test-fixed">fixed content 1</div>
    </div>

    <div class="container-absolute">
        <div class="test-absolute">absolute content 1</div>
    </div>

</body>
</html>
