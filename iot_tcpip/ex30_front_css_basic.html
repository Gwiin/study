<html lang="ko">
<head>

    <title>Document</title>

    <div>blue div이다</div>

    <div class="yellow">blue div이다</div>
    <div class="yellow">blue div이다</div>
    <div class="yellow">blue div이다</div>

        function my_display(x){
            document.getElementById('id1').innerHTML = "ㅋㅋ";
        }
    </script>
    <button onclick="my_display()">ㅋㅋ</button>

</body>
</html>
