<!-- ex52_front_css_flex_반응형.html -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .my-header, .my-footer{
            background-color: rgb(130, 209, 255);
            height: 100px; text-align: center;
        }
        .container{
            background-color: rgb(96, 253, 148);
            display: flex;
            flex-direction: row;
            margin: auto;

        }
        .flex-item{
            margin: 10px auto;
            padding: 10px; width: 150px;
            border-radius: 10px;
            background-color: gray;
            height: 100px;
            color: white; text-align: center;
        }
        @media (max-width:800px){
            .container{flex-direction: column;}    
        }
        
    </style>
</head>
<body>
        <div class="my-header">검색창</div>
        <div class="container">
            <div class="flex-item">컨텐츠 박스 1</div>
            <div class="flex-item">컨텐츠 박스 2</div>
            <div class="flex-item">컨텐츠 박스 3</div> 
            <div class="flex-item">컨텐츠 박스 4</div> 
        </div>
        <div class="my-footer">회사 소개 글</div>
    
</body>
</html>
